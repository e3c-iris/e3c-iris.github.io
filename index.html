<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#101a18">
    <meta name="description" content="IRIS — Event sensing project.">
    <title>IRIS — Event sensing project</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100svh;
        display: grid;
        place-items: center;
        background: #101a18;
        color: #edf1e8;
        font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      }
      main { padding: 3rem 1.5rem; text-align: center; }
      .mark { width: 104px; height: 104px; margin: 0 auto 2.5rem; color: #b4c6a2; }
      .mark svg { display: block; width: 100%; height: 100%; }
      h1 {
        margin: 0;
        padding-left: .25em;
        font-size: clamp(4rem, 15vw, 7rem);
        font-weight: 400;
        letter-spacing: .25em;
        line-height: 1.1;
      }
      p {
        margin: 1.5rem 0 0;
        color: #aab9b0;
        font-size: .8rem;
        letter-spacing: .16em;
        line-height: 1.8;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">
        <svg viewBox="0 0 104 104" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="52" cy="52" r="47" stroke="currentColor" stroke-opacity=".2"/>
          <circle cx="52" cy="52" r="32" stroke="currentColor" stroke-opacity=".45"/>
          <circle cx="52" cy="52" r="17" stroke="currentColor" stroke-opacity=".75"/>
          <circle cx="52" cy="52" r="4" fill="currentColor"/>
          <circle cx="78" cy="33" r="3" fill="currentColor"/>
        </svg>
      </div>
      <h1>IRIS</h1>
      <p>Event sensing project</p>
    </main>
  </body>
</html>

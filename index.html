<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#171321">
    <meta name="description" content="IRIS — Event sensing project.">
    <title>IRIS — Event sensing project</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500&display=swap" rel="stylesheet">
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100svh;
        display: grid;
        place-items: center;
        background: #171321;
        color: #edf1e8;
        font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      }
      main { padding: 3rem 1.5rem; text-align: center; }
      .mark { width: 260px; max-width: 100%; margin: 0 auto 2.5rem; }
      .mark img { display: block; width: 100%; height: auto; }
      h1 {
        margin: 0;
        padding-left: .14em;
        font-family: "Space Grotesk", "Helvetica Neue", sans-serif;
        font-size: clamp(4rem, 15vw, 7rem);
        font-weight: 500;
        letter-spacing: .14em;
        line-height: 1.1;
      }
      p {
        margin: 1.5rem 0 0;
        color: #aab9b0;
        font-size: .8rem;
        letter-spacing: .16em;
        line-height: 1.8;
        text-transform: uppercase;
      }
      .status {
        display: inline-flex;
        align-items: center;
        gap: .6rem;
        margin-top: 2rem;
        padding: .5rem .85rem;
        border: 1px solid #ffffff18;
        border-radius: 999px;
        color: #8c9ba4;
        font-size: .65rem;
        letter-spacing: .12em;
      }
      .status::before {
        content: "";
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: #4f85bf;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">
        <img src="iris-logo-transparent.png" width="960" height="960" alt="">
      </div>
      <!-- <h1>IRIS</h1> -->
      <p>Event sensing project</p>
      <p class="status">In stealth mode</p>
    </main>
  </body>
</html>
